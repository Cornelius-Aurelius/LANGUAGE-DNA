name: LanguageDNA mobile browser checks

on:
  push:
    branches: [ upgrade/full-platform-v17 ]
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve LanguageDNA locally
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/languagedna-http.log 2>&1 &
      - name: Test real mobile and desktop layouts
        run: npx playwright test tests/mobile-browser.spec.cjs --reporter=line --workers=1
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7
